<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز مواعيد كرة القدم</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- خط عربي جميل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(to bottom, #4CAF50, #2E7D32), url('https://via.placeholder.com/1920x1080/4CAF50/FFFFFF?text=Football+Field') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-top: 50px;
        }
        h1, h2 {
            color: #2E7D32;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .btn-success {
            background: linear-gradient(45deg, #4CAF50, #66BB6A);
            border: none;
            transition: transform 0.2s;
        }
        .btn-success:hover {
            transform: scale(1.05);
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #4CAF50;
        }
        .booking {
            background: #E8F5E8;
            border-left: 5px solid #4CAF50;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
        }
        .price {
            font-size: 20px;
            color: #D32F2F;
            font-weight: bold;
        }
        #paymentForm {
            background: #FFF3E0;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">⚽ حجز موعد للعب كرة القدم</h1>
        <p class="text-center">كل حجز مدته ساعة واحدة. السعر: <span class="price">12 ريال عماني</span> للساعة.</p>
        
        <form id="bookingForm" class="row g-3">
            <div class="col-md-6">
                <label for="name" class="form-label">اسمك:</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label for="date" class="form-label">التاريخ:</label>
                <input type="date" id="date" class="form-control" required>
            </div>
            <div class="col-12">
                <label for="time" class="form-label">الوقت (ساعة البداية):</label>
                <select id="time" class="form-select" required>
                    <option value="">اختر الوقت</option>
                    <option value="09:00">9:00 ص</option>
                    <option value="10:00">10:00 ص</option>
                    <option value="11:00">11:00 ص</option>
                    <option value="12:00">12:00 م</option>
                    <option value="13:00">1:00 م</option>
                    <option value="14:00">2:00 م</option>
                    <option value="15:00">3:00 م</option>
                    <option value="16:00">4:00 م</option>
                    <option value="17:00">5:00 م</option>
                    <option value="18:00">6:00 م</option>
                    <option value="19:00">7:00 م</option>
                    <option value="20:00">8:00 م</option>
                    <option value="21:00">9:00 م</option>
                </select>
            </div>
            <div class="col-12 text-center">
                <button type="submit" class="btn btn-success btn-lg">احجز الآن</button>
            </div>
        </form>
        
        <!-- نموذج الدفع -->
        <div id="paymentForm" class="mt-4" style="display: none;">
            <h2>💳 الدفع</h2>
            <p class="price">المبلغ الإجمالي: 12 ريال عماني</p>
            <form id="payForm" class="row g-3">
                <div class="col-md-6">
                    <label for="cardNumber" class="form-label">رقم البطاقة (وهمي):</label>
                    <input type="text" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="col-md-3">
                    <label for="expiry" class="form-label">تاريخ الانتهاء:</label>
                    <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required>
                </div>
                <div class="col-md-3">
                    <label for="cvv" class="form-label">CVV:</label>
                    <input type="text" id="cvv" class="form-control" placeholder="123" required>
                </div>
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-success">ادفع الآن (وهمي)</button>
                </div>
            </form>
            <p class="mt-3">أو ادفع عبر PayPal: <a href="https://www.paypal.com/paypalme/yourpaypalid?amount=12" target="_blank" class="btn btn-outline-primary">اضغط هنا</a></p>
        </div>
        
        <h2 class="mt-5">📅 الحجوزات الحالية</h2>
        <div id="bookings"></div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('bookingForm');
        const payForm = document.getElementById('payForm');
        const paymentForm = document.getElementById('paymentForm');
        const bookingsDiv = document.getElementById('bookings');
        
        let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
        
        function displayBookings() {
            bookingsDiv.innerHTML = '';
            bookings.forEach((booking, index) => {
                const div = document.createElement('div');
                div.className = 'booking';
                div.innerHTML = `<strong>${booking.name}</strong> - ${booking.date} في ${booking.time} (ساعة واحدة، 12 ريال) <button class="btn btn-danger btn-sm ms-2" onclick="deleteBooking(${index})">حذف</button>`;
                bookingsDiv.appendChild(div);
            });
        }
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            
            const exists = bookings.some(b => b.date === date && b.time === time);
            if (exists) {
                alert('هذا الوقت محجوز بالفعل!');
                return;
            }
            
            bookings.push({ name, date, time, paid: false });
            localStorage.setItem('bookings', JSON.stringify(bookings));
            displayBookings();
            form.reset();
            paymentForm.style.display = 'block';
            alert('تم الحجز! الآن ادفع لتأكيد الحجز.');
        });
        
        payForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('تم الدفع بنجاح (وهمي)! الحجز مؤكد.');
            paymentForm.style.display = 'none';
            bookings[bookings.length - 1].paid = true;
            localStorage.setItem('bookings', JSON.stringify(bookings));
            displayBookings();
        });
        
        function deleteBooking(index) {
            bookings.splice(index, 1);
            localStorage.setItem('bookings', JSON.stringify(bookings));
            displayBookings();
        }
        
        displayBookings();
    </script>
</body>
</html>
